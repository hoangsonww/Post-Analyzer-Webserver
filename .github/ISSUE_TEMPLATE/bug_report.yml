name: Bug Report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below as completely as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Call endpoint / CLI command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      options:
        - Gateway (HTTP / web UI)
        - postsvc (RPC)
        - authsvc (RPC / ABAC)
        - Messaging (Kafka / RabbitMQ / RocketMQ consumers)
        - ML / Sentiment (Triton)
        - Object storage (MinIO)
        - CLI / REPL
        - Docker / Docker Compose
        - Kubernetes / Terraform
        - Other
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "e.g. go1.25.0"

  - type: input
    id: deployment
    attributes:
      label: Deployment (Compose / kind / cloud)
      placeholder: "e.g. docker compose up -d on macOS"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any service logs, stack traces, or API response bodies.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, request traces, anything else that might help.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest version of the app.
          required: true
