worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # gzip at the edge in addition to the gateway's own compression
    # middleware — cheap here, and covers anything nginx serves directly.
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    limit_req_zone $binary_remote_addr zone=nginx_edge:10m rate=20r/s;

    # Docker's embedded DNS (127.0.0.11) round-robins A records across all
    # replicas of a scaled service. A static `upstream {}` block only
    # resolves that once, at nginx startup — it would never see replicas
    # added later by `docker compose up --scale gateway=N`. Using a
    # resolver + a variable in proxy_pass instead forces nginx to
    # re-resolve "gateway" on every request (bounded by valid=10s), so
    # scaling is picked up without an nginx reload.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # TLS termination point: in production, terminate HTTPS here
        # (listen 443 ssl; ssl_certificate ...) and keep this proxy_pass
        # as-is — the gateway itself only needs to speak plain HTTP
        # behind this edge.

        limit_req zone=nginx_edge burst=40 nodelay;

        set $gateway_upstream gateway:8080;

        location / {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://$gateway_upstream/health;
            access_log off;
        }
    }
}
