apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: post-analyzer
spec:
  replicas: 1
  strategy:
    type: Recreate # single-writer DB: never run two Postgres pods against the same volume
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: postanalyzer }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: post-analyzer-secrets, key: DB_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          emptyDir: {} # demo-scale only; use a PersistentVolumeClaim for real data durability
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: post-analyzer
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
