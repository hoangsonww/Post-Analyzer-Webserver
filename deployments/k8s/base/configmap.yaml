apiVersion: v1
kind: ConfigMap
metadata:
  name: post-analyzer-config
  namespace: post-analyzer
data:
  ENVIRONMENT: "production"
  DB_TYPE: "postgres"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "postanalyzer"
  DB_SSL_MODE: "disable"
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  REDIS_ENABLED: "true"
  REDIS_ADDR: "redis:6379"
  KAFKA_ENABLED: "false"
  RABBITMQ_ENABLED: "false"
  ROCKETMQ_ENABLED: "false"
  MINIO_ENABLED: "false"
  TRITON_ENABLED: "false"
  ADMIN_USERNAME: "admin"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "1m"
  MAX_BODY_SIZE: "1048576"
  ALLOWED_ORIGINS: "*"
  RPC_MUX: "true"
  # POSTSVC_ADDR / AUTHSVC_ADDR are intentionally NOT here: postsvc/authsvc
  # need them set to "0.0.0.0:PORT" (bind address) while every other
  # service needs "postsvc:9001" / "authsvc:9002" (dial address via
  # Kubernetes Service DNS) — same value name, different meaning per
  # deployment. Each Deployment below sets these directly.
