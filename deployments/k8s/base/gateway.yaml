# Plain Deployment with an explicit rolling-update strategy — the
# portable default that needs no CRDs. deployments/k8s/rollout/ has an
# Argo Rollouts variant of this same Deployment for blue-green/canary
# progressive delivery; swap it in via the "canary" overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: post-analyzer
  labels: { app: gateway }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postsvc 9001 && nc -z authsvc 9002; do echo waiting for postsvc/authsvc; sleep 2; done"]
      containers:
        - name: gateway
          image: post-analyzer/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: post-analyzer-config }
          env:
            - { name: POSTSVC_ADDR, value: "postsvc:9001" }
            - { name: AUTHSVC_ADDR, value: "authsvc:9002" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: post-analyzer-secrets, key: JWT_SECRET } }
          readinessProbe:
            # /readiness actually calls through to postsvc over RPC — a
            # pod that can't reach its backends must not receive traffic.
            # /health (used below for liveness) is deliberately shallow:
            # it must stay 200 even during a transient backend outage, or
            # kubelet would kill and restart a gateway pod that's otherwise
            # fine, instead of just pulling it out of rotation.
            httpGet: { path: /readiness, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: post-analyzer
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
