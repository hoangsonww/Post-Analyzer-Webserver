# Demo-only plaintext Secret manifest. In a real cluster, generate this
# via `kubectl create secret generic ... --from-literal=...` (never
# commit real values) or a secrets manager (Sealed Secrets, External
# Secrets Operator, cloud KMS-backed CSI driver) — not a checked-in file.
apiVersion: v1
kind: Secret
metadata:
  name: post-analyzer-secrets
  namespace: post-analyzer
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  JWT_SECRET: "change-me-in-production"
  ADMIN_PASSWORD: "admin123"
