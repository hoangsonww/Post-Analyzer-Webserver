# staging overlay — a second cluster (or, in this repo's multicluster
# demo, a distinct kubectl context) sitting between dev and prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target: { kind: Deployment, name: gateway }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: post-analyzer/gateway
    newName: ghcr.io/hoangsonww/post-analyzer-gateway
    newTag: staging
  - name: post-analyzer/postsvc
    newName: ghcr.io/hoangsonww/post-analyzer-postsvc
    newTag: staging
  - name: post-analyzer/authsvc
    newName: ghcr.io/hoangsonww/post-analyzer-authsvc
    newTag: staging
