# Argo Rollouts variant of base/gateway.yaml's Deployment, for real
# progressive delivery (canary with automated analysis, or blue-green)
# instead of a plain Kubernetes rolling update. Requires the Argo
# Rollouts controller + CRDs installed in-cluster:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# Swap this in for base/gateway.yaml's Deployment (same Service, same
# pod template) when progressive delivery is needed; the plain
# Deployment stays the default so `kubectl apply -k base/` never
# requires the Argo CRDs to exist.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  namespace: post-analyzer
  labels: { app: gateway }
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postsvc 9001 && nc -z authsvc 9002; do sleep 2; done"]
      containers:
        - name: gateway
          image: post-analyzer/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: post-analyzer-config }
          env:
            - { name: POSTSVC_ADDR, value: "postsvc:9001" }
            - { name: AUTHSVC_ADDR, value: "authsvc:9002" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: post-analyzer-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
  strategy:
    canary:
      # Weighted traffic shift via the Service below, promoted
      # automatically on each analysis pass and paused indefinitely
      # (until a human runs `kubectl argo rollouts promote gateway`)
      # right before 100% — the "manual gate before full blue-green cutover"
      # pattern.
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: gateway-health-check
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
        - pause: {} # indefinite: promote manually once verified
      trafficRouting:
        nginx:
          stableIngress: post-analyzer
      canaryService: gateway-canary
      stableService: gateway
---
# Automated canary analysis: fails (triggering automatic rollback) if the
# canary pods' error rate crosses the threshold during the rollout steps
# above, instead of relying solely on the human pause gates.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-health-check
  namespace: post-analyzer
spec:
  metrics:
    - name: error-rate
      interval: 15s
      successCondition: result < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total[1m]))
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  namespace: post-analyzer
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
