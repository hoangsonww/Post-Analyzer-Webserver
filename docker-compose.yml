services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: post-analyzer-db
    environment:
      POSTGRES_DB: postanalyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: post-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Kafka (KRaft mode, single node) — post-events analytics stream.
  # PLAINTEXT is for other containers on this network; PLAINTEXT_HOST is
  # for host-side tools/tests connecting via localhost:9094.
  kafka:
    image: apache/kafka:latest
    container_name: post-analyzer-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    restart: unless-stopped
    networks:
      - app-network

  # RabbitMQ — reanalysis job queue. Management UI on :15672 (guest/guest).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: post-analyzer-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # RocketMQ nameserver — post-notifications delayed/scheduled messages.
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: post-analyzer-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    restart: unless-stopped
    networks:
      - app-network

  # RocketMQ broker. brokerIP1 in broker.conf points at this service's own
  # compose DNS name so other containers (postsvc, notification-consumer)
  # can reach it; that only resolves inside this compose network.
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: post-analyzer-rocketmq-broker
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/broker.conf"]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - ./deployments/rocketmq/broker.conf:/home/rocketmq/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped
    networks:
      - app-network

  # Post Analyzer application
  # NOTE: still builds the pre-split single binary via the root Dockerfile.
  # This is superseded by the dedicated gateway/postsvc/authsvc services
  # (with nginx, message brokers, and object storage) added in a later
  # commit — kept here until that full compose file lands.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: post-analyzer-app
    environment:
      # Server configuration
      PORT: 8080
      HOST: 0.0.0.0
      ENVIRONMENT: production
      READ_TIMEOUT: 15s
      WRITE_TIMEOUT: 15s
      SHUTDOWN_TIMEOUT: 30s

      # Database configuration
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postanalyzer
      DB_SSL_MODE: disable
      DB_MAX_CONNS: 25
      DB_MIN_CONNS: 5

      # Security configuration
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW: 1m
      MAX_BODY_SIZE: 1048576
      ALLOWED_ORIGINS: "*"

      # Logging configuration
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_OUTPUT: stdout

      # External API configuration
      JSONPLACEHOLDER_URL: https://jsonplaceholder.typicode.com/posts
      HTTP_TIMEOUT: 30s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: post-analyzer-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: post-analyzer-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
